<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echogram - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-box">
      <h2>Echogram</h2>
      <p class="auth-subtitle">Welcome back</p>
      
      <div id="auth-error" class="error-msg hidden"></div>

      <form id="login-form">
        <div class="form-group">
          <input type="text" id="login-username" placeholder="Username" required>
        </div>
        <div class="form-group">
          <input type="password" id="login-password" placeholder="Password" required>
        </div>
        <button type="submit" class="primary-btn full-width">Log In</button>
      </form>

      <form id="register-form" class="hidden">
        <div class="form-group">
          <input type="text" id="reg-username" placeholder="Username" required>
        </div>
        <div class="form-group">
          <input type="email" id="reg-email" placeholder="Email" required>
        </div>
        <div class="form-group">
          <input type="password" id="reg-password" placeholder="Password" required>
        </div>
        <button type="submit" class="primary-btn full-width">Sign Up</button>
      </form>

      <div class="auth-switch">
        <span id="switch-to-register">Don't have an account? Sign up</span>
        <span id="switch-to-login" class="hidden">Already have an account? Log in</span>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('switch-to-register').addEventListener('click', () => {
      document.getElementById('login-form').classList.add('hidden');
      document.getElementById('register-form').classList.remove('hidden');
      document.getElementById('switch-to-register').classList.add('hidden');
      document.getElementById('switch-to-login').classList.remove('hidden');
      document.getElementById('auth-error').classList.add('hidden');
    });

    document.getElementById('switch-to-login').addEventListener('click', () => {
      document.getElementById('register-form').classList.add('hidden');
      document.getElementById('login-form').classList.remove('hidden');
      document.getElementById('switch-to-login').classList.add('hidden');
      document.getElementById('switch-to-register').classList.remove('hidden');
      document.getElementById('auth-error').classList.add('hidden');
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('login-username').value;
      const password = document.getElementById('login-password').value;
      
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('echogram_user', data.username);
          localStorage.setItem('echogram_admin', data.isAdmin);
          window.location.href = '/';
        } else {
          showError(data.error);
        }
      } catch (err) {
        showError('Login failed');
      }
    });

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('reg-username').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;
      
      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });
        const data = await res.json();
        if (res.ok) {
          document.getElementById('switch-to-login').click();
          showError('Registration successful. Please log in.');
          document.getElementById('auth-error').style.color = 'black';
        } else {
          showError(data.error);
        }
      } catch (err) {
        showError('Registration failed');
      }
    });

    function showError(msg) {
      const errEl = document.getElementById('auth-error');
      errEl.textContent = msg;
      errEl.classList.remove('hidden');
      errEl.style.color = 'black'; // Kept B&W theme
    }
  </script>
</body>
</html>
